name: Build Android APK

# Builds an installable (debug-signed) Android APK in the cloud and uploads it
# as a downloadable artifact — no local Godot / Android SDK needed.
# Run it from the repo's "Actions" tab (Run workflow), or it runs on push.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/trusting-hawking-ndlwx1

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: TracingFun

jobs:
  android:
    name: Export Android (debug APK)
    runs-on: ubuntu-latest
    # Image ships Godot + export templates + Android SDK.
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move templates + editor settings into HOME
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p ~/.config
          mv /root/.config/godot ~/.config/godot
          echo "=== godot config dir ==="
          ls -la ~/.config/godot/ 2>/dev/null || echo "(nothing)"
          echo "=== editor_settings-4.tres ==="
          cat ~/.config/godot/editor_settings-4.tres 2>/dev/null | head -40 || echo "(not found)"

      - name: Generate debug keystore and inject into editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -deststoretype pkcs12

          SETTINGS="$HOME/.config/godot/editor_settings-4.tres"

          # Create the file if the image didn't ship one
          if [ ! -f "$SETTINGS" ]; then
            mkdir -p "$(dirname "$SETTINGS")"
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi

          # Strip any existing keystore lines, then append fresh ones
          grep -v "^export/android/debug_keystore" "$SETTINGS" > "$SETTINGS.tmp"
          mv "$SETTINGS.tmp" "$SETTINGS"
          echo "export/android/debug_keystore = \"$HOME/debug.keystore\"" >> "$SETTINGS"
          echo 'export/android/debug_keystore_user = "androiddebugkey"'  >> "$SETTINGS"
          echo 'export/android/debug_keystore_pass = "android"'          >> "$SETTINGS"

          echo "=== settings after update ==="
          cat "$SETTINGS"

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export debug-signed APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/${EXPORT_NAME}.apk
          ls -la build/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-android-apk
          path: build/android/*.apk
          if-no-files-found: error
