name: Build Android APK

# Builds an installable (debug-signed) Android APK in the cloud and uploads it
# as a downloadable artifact — no local Godot / Android SDK needed.
# Run it from the repo's "Actions" tab (Run workflow), or it runs on push.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/trusting-hawking-ndlwx1

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: TracingFun

jobs:
  android:
    name: Export Android (debug APK)
    runs-on: ubuntu-latest
    # Image ships Godot + export templates + Android SDK.
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move templates + editor settings into HOME
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p ~/.config
          mv /root/.config/godot ~/.config/godot

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export debug-signed APK
        run: |
          # Self-signed debug keystore (no secrets needed for a debug build).
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -deststoretype pkcs12
          # Godot reads the keystore from these env vars (overrides editor settings).
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/${EXPORT_NAME}.apk
          ls -la build/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-android-apk
          path: build/android/*.apk
          if-no-files-found: error
